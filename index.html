<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة فاهم التعليمية</title>
  <meta name="description" content="منصة فاهم التعليمية - حمل التطبيق الآن واستمتع بأفضل تجربة تعليمية.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    /* شريط التنبيهات المتحرك */
    .ticker-bar {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
      text-align: center;
      max-width: 450px;
      width: 100%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 110px;
      height: 110px;
      border-radius: 25px;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 15px;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    h1 { font-size: 26px; margin-bottom: 8px; color: #ffffff; font-weight: 700; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
    
    /* مميزات سريعة */
    .features {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
      gap: 10px;
    }
    .feature-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      color: #cbd5e1;
      flex: 1;
    }

    .download-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      padding: 15px 25px;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 17px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      transition: all 0.3s ease;
      margin-bottom: 15px;
    }
    .download-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6); }

    .support-link {
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      transition: color 0.2s;
    }
    .support-link:hover { color: #7dd3fc; text-decoration: underline; }
  </style>
</head>
<body>

  <!-- شريط التنبيهات العاجل -->
  <div class="ticker-bar">
    🚨 تنبيه: تم تحديث التطبيق لأحدث إصدار، حمّله الآن!
  </div>

  <div class="container">
    <!-- اللوجو -->
    <img src="https://lh3.googleusercontent.com/d/13f5hYTuiTwFpb_mXm84w32JkhpFF_czT" alt="شعار منصة فاهم" class="logo">
    <h1>منصة فاهم التعليمية</h1>
    <p>بوابتك الأولى للتفوق الدراسي والمراجعات الشاملة</p>
    
    <!-- مميزات سريعة -->
    <div class="features">
      <div class="feature-box">⚡ سريع وخفيف</div>
      <div class="feature-box">📚 محتوى شامل</div>
      <div class="feature-box">🔒 آمن وموثوق</div>
    </div>

    <!-- زر التحميل الرئيسي -->
    <div>
      <a href="https://drive.google.com/file/d/1BQLReYa_kd0B29EvyBIyHX5xaeLJlLq9/view?usp=drivesdk" target="_blank" class="download-btn">
        📥 تحميل التطبيق (APK)
      </a>
    </div>

    <!-- زر التواصل أو الدعم -->
    <div>
      <a href="https://t.me/" target="_blank" class="support-link">
        💬 انضم لقناة الدعم والتواصل
      </a>
    </div>
  </div>

</body>
</html>
