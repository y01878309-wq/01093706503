<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصه فاهم التعليميه.farag</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 15px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .admin-title {
      color: #38bdf8;
      font-size: 15px;
      font-weight: 600;
    }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .nav-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 25px;
    }
    .nav-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .nav-btn.active {
      background: #0284c7;
      color: white;
      border-color: #38bdf8;
    }
    .section-title {
      text-align: center;
      font-size: 16px;
      margin-bottom: 15px;
      color: #ffffff;
      font-weight: bold;
    }
    .student-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .student-info {
      text-align: right;
    }
    .student-id {
      color: #38bdf8;
      font-size: 14px;
      font-weight: bold;
      direction: ltr;
    }
    .exam-name {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 3px;
    }
    .score-badge {
      background: #1e293b;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <button class="logout-btn" onclick="alert('تم تسجيل الخروج')">خروج</button>
    <div class="admin-title">لوحة تحكم الأدمن (يوسف فرج)</div>
  </div>

  <div class="nav-grid">
    <button class="nav-btn">🎥 الفيديوهات</button>
    <button class="nav-btn">📝 الامتحانات</button>
    <button class="nav-btn">💡 الحل</button>
    <button class="nav-btn active">🏆 التقييم والترتيب</button>
    <button class="nav-btn">📁 ملفات PDF</button>
    <button class="nav-btn">⚙️️ لوحة التحكم والإضافة</button>
  </div>

  <div class="section-title">ترتيب الطلاب الأوائل</div>

  <div class="student-card">
    <div class="score-badge">2 / 0</div>
    <div class="student-info">
      <div class="student-id">#1y01878309</div>
      <div class="exam-name">امتحان الفيزياء التجريبي - الفصل الأول</div>
    </div>
  </div>

  <div class="student-card">
    <div class="score-badge">2 / 2</div>
    <div class="student-info">
      <div class="student-id">#2y01878309</div>
      <div class="exam-name">امتحان الفيزياء التجريبي - الفصل الأول</div>
    </div>
  </div>

  <div class="student-card">
    <div class="score-badge">2 / 1</div>
    <div class="student-info">
      <div class="student-id">#3y01878309</div>
      <div class="exam-name">امتحان الفيزياء التجريبي - الفصل الأول</div>
    </div>
  </div>

</body>
</html>
