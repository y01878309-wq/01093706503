<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصه فاهم التعليميه.farag</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .container {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .input-box {
      width: 100%;
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 23, 42, 0.9);
      color: white;
      font-size: 14px;
      margin-bottom: 15px;
      text-align: right;
    }
    .input-box::placeholder {
      color: #64748b;
    }
    .input-box:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .action-btn {
      background: #0284c7;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: background 0.3s;
    }
    .action-btn:hover {
      background: #0369a1;
    }
    .whatsapp-btn {
      background: #22c55e;
      color: white;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      text-decoration: none;
      display: block;
      width: 100%;
      transition: background 0.3s;
    }
    .whatsapp-btn:hover {
      background: #16a34a;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>منصة فاهم التعليمية</h1>
    <div class="subtitle">سجل بريدك الإلكتروني، كلمة المرور، ورمز المنصة (78).</div>
    
    <form onsubmit="handleLogin(event)">
      <input type="email" id="email" class="input-box" placeholder="بريدك الإلكتروني (Gmail)" required>
      <input type="password" id="password" class="input-box" placeholder="كلمة السر الخاصة بك" required>
      <input type="text" id="passcode" class="input-box" placeholder="رمز المنصة (78)" required>
      
      <button type="submit" class="action-btn">تسجيل الدخول / إنشاء حساب 🚀</button>
    </form>

    <a href="https://wa.me/201093706503?text=مرحباً، أريـد%20الحصول%20على%20رمز%20منصة%20فاهم" target="_blank" class="whatsapp-btn">
      💬 تواصل مع المسؤول عبر واتساب (01093706503)
    </a>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      const passcode = document.getElementById('passcode').value.trim();
      
      if (passcode === '78') {
        alert('أهلاً بك يا بطل! تم تسجيل الدخول بنجاح.');
        // تقدر تضيف هنا توجيه أو فتح المحتوى لو حابب
      } else {
        alert('رمز المنصة غير صحيح! تأكد من إدخال الرمز (78) أو تواصل عبر الواتساب.');
      }
    }
  </script>

</body>
</html>
