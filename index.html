<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>منصة فاهم التعليمية</title>
  <style>body{background:#0b0f19;color:#fff;font-family:sans-serif;text-align:center;padding:50px;}input,button{display:block;width:100%;max-width:300px;margin:10px auto;padding:10px;background:#111827;color:#fff;border:1px solid #374151;border-radius:5px;}button{background:#0284c7;border:none;font-weight:bold;cursor:pointer;}</style>
</head>
<body>
  <div id="login">
    <h2>منصة فاهم التعليمية</h2>
    <input type="email" id="e" placeholder="بريدك الإلكتروني (Gmail)">
    <input type="password" id="p" placeholder="كلمة السر الخاصة بك">
    <input type="text" id="c" placeholder="رمز المنصة (78)">
    <button onclick="check()">تسجيل الدخول / إنشاء حساب 🚀</button>
  </div>
  <div id="app" style="display:none;">
    <h2>🎓 أهلاً بك داخل المنصة</h2>
    <p>فيديوهات ومحتوى المنصة شغالين هنا يا بطل!</p>
    <!-- هنا الفيديوهات بتاعتك -->
  </div>
  <script>
    function check(){
      if(document.getElementById('c').value.trim() === '78'){
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      }else{
        alert('الكود خطأ، اكتب 78');
      }
    }
  </script>
</body>
</html>
