<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة فاهم التعليمية</title>
  <meta name="description" content="منصة فاهم التعليمية - حمل التطبيق الآن واستمتع بأفضل تجربة تعليمية.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 130px;
      height: 130px;
      border-radius: 25px;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      border: 3px solid rgba(255, 255, 255, 0.2);
    }
    h1 { font-size: 28px; margin-bottom: 10px; color: #ffffff; font-weight: 700; }
    p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }
    .download-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      padding: 16px 30px;
      text-decoration: none;
      border-radius: 50px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }
    .download-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(2, 132, 199, 0.6); }
  </style>
</head>
<body>

  <div class="container">
    <!-- صورة اللوجو الجديد -->
    <img src="https://lh3.googleusercontent.com/d/13f5hYTuiTwFpb_mXm84w32JkhpFF_czT" alt="شعار منصة فاهم" class="logo">
    <h1>منصة فاهم التعليمية</h1>
    <p>حمل التطبيق الآن وابدأ رحلتك التعليمية بكل سهولة</p>
    <div>
      <!-- زرار التحميل بالرابط الجديد -->
      <a href="https://drive.google.com/file/d/1BQLReYa_kd0B29EvyBIyHX5xaeLJlLq9/view?usp=drivesdk" target="_blank" class="download-btn">
        📥 تحميل تطبيق المنصة (APK)
      </a>
    </div>
  </div>

</body>
</html>
